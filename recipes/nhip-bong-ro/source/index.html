<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0a0c0e;
        --ink: #ffffff;
        --font-display: "League Gothic";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); font-family: var(--font-display); }
      #cam { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; }
      video.clip, .shot video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .full { position: absolute; inset: 0; width: 100%; height: 100%; }
      .word { display: block; width: fit-content; color: var(--ink); font-size: 300px; line-height: 0.88; text-transform: uppercase; letter-spacing: 0.01em; }
      #words { position: absolute; left: 120px; top: 360px; width: 600px; height: 560px; font-size: 0; }
      #words .word { font-size: 200px; }
      #endcard { position: absolute; inset: 0; background: var(--ground); }
      #end-outline { opacity: 0.2; }
      #end-words { position: absolute; left: 120px; top: 360px; width: 860px; height: 900px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16.6" data-width="1080" data-height="1920">
      <div id="cam">
        <video id="s01" class="clip" src="assets/s01.mp4" muted playsinline data-start="0" data-duration="0.826" data-media-start="0" data-track-index="0"></video>
        <video id="s02" class="clip" src="assets/s02.mp4" muted playsinline data-start="0.826" data-duration="0.859" data-media-start="0" data-track-index="0"></video>
        <video id="s03" class="clip" src="assets/s03.mp4" muted playsinline data-start="1.685" data-duration="0.43" data-media-start="0" data-track-index="0"></video>
        <video id="s04" class="clip" src="assets/s04.mp4" muted playsinline data-start="2.115" data-duration="0.847" data-media-start="0" data-track-index="0"></video>
        <video id="s05" class="clip" src="assets/s05.mp4" muted playsinline data-start="2.962" data-duration="0.848" data-media-start="0" data-track-index="0"></video>
        <video id="s06" class="clip" src="assets/s06.mp4" muted playsinline data-start="3.81" data-duration="0.441" data-media-start="0" data-track-index="0"></video>
        <video id="s07" class="clip" src="assets/s07.mp4" muted playsinline data-start="4.251" data-duration="0.859" data-media-start="0" data-track-index="0"></video>
        <div class="shot" id="w08">
          <video id="s08" class="clip" src="assets/s08.mp4" muted playsinline data-start="5.11" data-duration="1.289" data-media-start="0" data-track-index="0"></video>
        </div>
        <video id="s09" class="clip" src="assets/s09.mp4" muted playsinline data-start="6.399" data-duration="0.859" data-media-start="0" data-track-index="0"></video>
        <div class="shot" id="w10">
          <video id="s10" class="clip" src="assets/s10.mp4" muted playsinline data-start="7.258" data-duration="1.742" data-media-start="0" data-track-index="0"></video>
        </div>
        <video id="s11" class="clip" src="assets/s11.mp4" muted playsinline data-start="9" data-duration="1.043" data-media-start="0" data-track-index="0"></video>
        <div id="freeze" class="clip" data-start="10.043" data-duration="0.418" data-track-index="1">
          <div id="freeze-in" class="full">
            <img class="full" src="assets/freeze-dim.png" alt="" />
            <img class="full" src="assets/freeze-cut.png" alt="" />
            <img id="outline" class="full" src="assets/outline.png" alt="" />
          </div>
        </div>
        <video id="s13" class="clip" src="assets/s13.mp4" muted playsinline data-start="10.461" data-duration="0.65" data-media-start="0" data-track-index="0"></video>
        <video id="s14" class="clip" src="assets/s14.mp4" muted playsinline data-start="11.111" data-duration="0.65" data-media-start="0" data-track-index="0"></video>
        <video id="s15" class="clip" src="assets/s15.mp4" muted playsinline data-start="11.761" data-duration="0.638" data-media-start="0" data-track-index="0"></video>
        <video id="s16" class="clip" src="assets/s16.mp4" muted playsinline data-start="12.399" data-duration="0.639" data-media-start="0" data-track-index="0"></video>
        <div class="shot" id="w17">
          <video id="s17" class="clip" src="assets/s17.mp4" muted playsinline data-start="13.038" data-duration="1.255" data-media-start="0" data-track-index="0"></video>
        </div>
      </div>

      <div id="words" class="clip" data-start="7.688" data-duration="1.312" data-track-index="2">
        <span id="w-no" class="word">No</span>
        <span id="w-days" class="word">Days</span>
        <span id="w-off" class="word">Off</span>
      </div>

      <div id="endcard" class="clip" data-start="14.293" data-duration="2.307" data-track-index="3">
        <img id="end-outline" class="full" src="assets/end-outline.png" alt="" />
        <div id="end-words">
          <span class="word e-word">No</span>
          <span class="word e-word">Days</span>
          <span class="word e-word">Off</span>
        </div>
      </div>

      <audio id="bgm" src="assets/bgm.mp3" data-start="0" data-duration="16.6" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // camera shake on the heaviest hits: punch in, three decaying jolts, settle
      function shake(t, amp) {
        tl.fromTo("#cam", { scale: 1 }, { scale: 1.06, duration: 0.05, ease: "power2.out", immediateRender: false }, t);
        tl.to("#cam", {
          keyframes: [
            { x: amp, y: -amp * 0.6, rotation: 0.6, duration: 0.04 },
            { x: -amp * 0.7, y: amp * 0.5, rotation: -0.4, duration: 0.05 },
            { x: amp * 0.4, y: -amp * 0.3, rotation: 0.2, duration: 0.06 },
            { x: 0, y: 0, rotation: 0, duration: 0.08 },
          ],
          ease: "none",
        }, t);
        tl.to("#cam", { scale: 1, duration: 0.22, ease: "power2.inOut" }, t + 0.06);
      }
      shake(0.826, 18);
      shake(2.962, 16);
      shake(4.251, 26);
      shake(10.461, 22);

      // slow push-ins on the held shots
      tl.fromTo("#w08", { scale: 1.0 }, { scale: 1.08, duration: 1.289, ease: "none", immediateRender: false }, 5.11);
      tl.fromTo("#w10", { scale: 1.0 }, { scale: 1.06, duration: 1.742, ease: "none", immediateRender: false }, 7.258);
      tl.fromTo("#w17", { scale: 1.0 }, { scale: 1.07, duration: 1.255, ease: "power1.in", immediateRender: false }, 13.038);

      // words land one per snare hit in the build
      tl.set("#w-days", { opacity: 0 }, 0);
      tl.set("#w-off", { opacity: 0 }, 0);
      tl.set("#w-days", { opacity: 1 }, 8.106);
      tl.set("#w-off", { opacity: 1 }, 8.535);

      // freeze: outline draws up the player, still pushes in slightly
      tl.fromTo("#outline", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.14, ease: "power3.out", immediateRender: false }, 10.043);
      tl.fromTo("#freeze-in", { scale: 1.0 }, { scale: 1.035, duration: 0.418, ease: "power2.out", immediateRender: false }, 10.043);

      // end card: lockup settles, outline callback
      tl.fromTo(".e-word", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, stagger: 0.12, ease: "expo.out", immediateRender: false }, 14.293);
      tl.fromTo("#end-outline", { opacity: 0 }, { opacity: 0.2, duration: 0.6, ease: "power2.out", immediateRender: false }, 14.293);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
