/* Real estate: an architect's drawing of each room draws itself on a sheet lying in 3D on a dark desk; the sheet
   flattens to full frame as colour washes in, and becomes the real camera shot of that room. Music only. */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #16181b; }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Be Vietnam Pro', sans-serif;
  background: radial-gradient(ellipse 70% 70% at 50% 45%, #2a2d31 0%, #16181b 70%); perspective: 2400px; }
.clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.real { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
.sheet { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 50% 55%; opacity: 0;
  box-shadow: 0 60px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.2); }
.sheet .lab { position: absolute; left: 70px; bottom: 56px; color: #2a2b30; font-weight: 700; font-size: 26px; letter-spacing: 6px; }
.sheet .lab i { display: block; font-style: normal; font-weight: 500; font-size: 18px; letter-spacing: 3px; color: #6f7c8c; margin-top: 4px; }
.sheet .frm { position: absolute; inset: 26px; border: 2px solid rgba(40,42,48,.55); pointer-events: none; }
#title { position: absolute; left: 0; right: 0; bottom: 110px; text-align: center; color: #F6F1E8; opacity: 0; text-shadow: 0 6px 40px rgba(0,0,0,.55); }
#title b { display: block; font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500; font-size: 118px; line-height: 1.2; }
#title span { display: block; margin-top: 6px; font-weight: 700; font-size: 26px; letter-spacing: 8px; color: #E8C98A; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 95% 90% at 50% 50%, rgba(0,0,0,0) 62%, rgba(0,0,0,.4) 100%); }
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
  <!-- real shots under the sheets -->
  <div class="real" id="R1"><video id="r1" class="clip" src="assets/r03.mp4" data-start="3.4" data-duration="2.2" data-track-index="1" muted playsinline></video></div>
  <div class="real" id="R2"><video id="r2" class="clip" src="assets/r07.mp4" data-start="7.6" data-duration="2.2" data-track-index="2" muted playsinline></video></div>
  <div class="real" id="R3"><video id="r3" class="clip" src="assets/r13.mp4" data-start="11.3" data-duration="1.7" data-track-index="3" muted playsinline></video></div>
  <div class="real" id="R4"><video id="r4" class="clip" src="assets/r08.mp4" data-start="12.6" data-duration="2.4" data-track-index="4" muted playsinline></video></div>
  <!-- drawing sheets -->
  <div class="sheet" id="S1"><video id="d1" class="clip" src="assets/d1.mp4" data-start="0" data-duration="3.6" data-track-index="5" muted playsinline></video>
    <div class="frm" id="f1"></div><div class="lab" id="l1">FACADE<i>SCALE 1:100</i></div></div>
  <div class="sheet" id="S2"><video id="d2" class="clip" src="assets/d2.mp4" data-start="4.6" data-duration="3.0" data-track-index="6" muted playsinline></video>
    <div class="frm" id="f2"></div><div class="lab" id="l2">DOUBLE-HEIGHT HALL<i>SECTION A-A</i></div></div>
  <div class="sheet" id="S3"><video id="d3" class="clip" src="assets/d3.mp4" data-start="8.8" data-duration="2.5" data-track-index="7" muted playsinline></video>
    <div class="frm" id="f3"></div><div class="lab" id="l3">LIVING ROOM<i>INTERIOR VIEW</i></div></div>
  <div id="title"><b>Tropical Villa</b><span>FROM SKETCH TO LIVING SPACE</span></div>
  <div id="vig"></div>
  <audio id="music" src="assets/music.mp3" data-start="0" data-duration="15" data-track-index="9" data-volume="0.9"></audio>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  // one drawn room: the sheet lands tilted, draws, flattens to full frame as the colour arrives, then the real shot takes over
  function room(n, t0, drawEnd, sheetEnd, realEnd, fromRight) {
    const S = "#S" + n, R = "#R" + n;
    tl.set(S, { opacity: 1 }, t0);
    tl.fromTo(S, { rotationX: 34, rotationY: fromRight ? 42 : -6, rotationZ: fromRight ? 4 : -7, scale: 0.66, x: fromRight ? 900 : 0, y: 70 },
                 { rotationX: 30, rotationY: 0, rotationZ: -5, scale: 0.7, x: 0, y: 60, duration: fromRight ? 0.6 : 0.01, ease: "power3.out", immediateRender: false }, t0);
    tl.to(S, { rotationX: 22, rotationZ: -2, scale: 0.76, y: 40, duration: drawEnd - t0 - (fromRight ? 0.6 : 0), ease: "none" }, t0 + (fromRight ? 0.6 : 0));
    tl.to(S, { rotationX: 0, rotationZ: 0, scale: 1, y: 0, duration: 0.85, ease: "power3.inOut" }, drawEnd - 0.15);
    tl.to([S + " .frm", S + " .lab"], { opacity: 0, duration: 0.3 }, drawEnd + 0.2);
    tl.set(R, { opacity: 1 }, sheetEnd - 0.05);
    tl.set(S, { opacity: 0 }, sheetEnd);
    tl.fromTo(R + " video", { scale: 1 }, { scale: 1.09, duration: realEnd - sheetEnd + 0.3, ease: "none" }, sheetEnd);
    tl.set(R, { opacity: 0 }, realEnd + 0.4);
  }
  room(1, 0.0, 2.4, 3.6, 5.2, false);
  room(2, 4.6, 6.5, 7.6, 9.4, true);
  room(3, 8.8, 10.3, 11.3, 12.6, true);
  // the real shots step back a little as the next sheet lands on top
  tl.to("#R1", { scale: 0.94, filter: "brightness(0.55)", duration: 0.6, ease: "power2.inOut" }, 4.6);
  tl.to("#R2", { scale: 0.94, filter: "brightness(0.55)", duration: 0.6, ease: "power2.inOut" }, 8.8);
  // end: low angle on the facade, name
  tl.set("#R4", { opacity: 1 }, 12.6);
  tl.fromTo("#R4", { clipPath: "inset(0% 50% 0% 50%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power3.inOut", immediateRender: false }, 12.6);
  tl.fromTo("#r4", { scale: 1.12 }, { scale: 1.0, duration: 2.4, ease: "none" }, 12.6);
  tl.fromTo("#title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 13.1);
  tl.to({}, { duration: 0.01 }, 14.99);
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
})();
</script></body></html>
