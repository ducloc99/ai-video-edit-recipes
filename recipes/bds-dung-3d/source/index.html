/* Real estate: zoom into the satellite map, the plan draws on the lot, the camera tilts and the villa is built in 3D
   (walls, slab, upper floor, stone columns, roof, pool), then a scan turns the model into the real house. Music only. */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0f1114; }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0f1114; font-family: 'Be Vietnam Pro', sans-serif; color: #F4EFE6; }
.clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#map { position: absolute; left: 50%; top: 50%; width: 2600px; height: 2600px; margin: -1300px 0 0 -1300px; background: url(assets/map.jpg) center / cover; transform-origin: 50% 50%; }
#mapshade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(15,17,20,0) 30%, rgba(15,17,20,.75) 100%); }
#bp { position: absolute; inset: 0; opacity: 0; background-color: #111519;
  background-image: linear-gradient(rgba(227,193,111,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(227,193,111,.07) 1px, transparent 1px);
  background-size: 40px 40px; }
#pin { position: absolute; left: 948px; top: 470px; width: 24px; height: 24px; opacity: 0; }
#pin i { position: absolute; left: 0; top: 0; width: 24px; height: 24px; background: #E3C16F; transform: rotate(45deg); }
#stage { position: absolute; inset: 0; perspective: 2200px; perspective-origin: 50% 40%; }
#world { position: absolute; left: 260px; top: 90px; width: 1400px; height: 900px; transform-style: preserve-3d; transform-origin: 700px 450px; }
#plan { position: absolute; left: 0; top: 0; width: 1400px; height: 900px; overflow: visible; }
#plan .ln { fill: none; stroke: #E3C16F; stroke-width: 3; }
#plan .thin { fill: none; stroke: rgba(227,193,111,.55); stroke-width: 1.5; stroke-dasharray: 8 8; }
#plan text { fill: #E3C16F; font: 600 22px 'Be Vietnam Pro'; }
.box { position: absolute; transform-style: preserve-3d; }
.bx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-style: preserve-3d; transform-origin: 50% 50% 0; }
.f { position: absolute; box-shadow: inset 0 0 0 1px rgba(30,30,30,.22); }
.f.t { background: #F3F0E9; } .f.fb { background: #E2DCD0; } .f.lr { background: #CFC8B9; }
.pillar .f.t { background: #DCD3C2; } .pillar .f.fb { background: #C7BBA6; } .pillar .f.lr { background: #B4A892; }
.glass .f.fb { background: rgba(150,180,190,.55); }
#pool { position: absolute; left: 560px; top: 628px; width: 340px; height: 104px; background: #5FB7C9; transform: translateZ(2px); opacity: 0; box-shadow: inset 0 0 0 3px #F3F0E9; }
#lawn { position: absolute; left: 300px; top: 180px; width: 800px; height: 580px; background: #6E8E58; opacity: 0; }
#real { position: absolute; inset: 0; clip-path: inset(0% 100% 0% 0%); }
#scan { position: absolute; left: -10px; top: 0; width: 10px; height: 1080px; background: #FFF6E2; box-shadow: 0 0 40px 14px rgba(227,193,111,.9); opacity: 0; }
#real2w { position: absolute; inset: 0; opacity: 0; }
#step { position: absolute; left: 80px; bottom: 70px; font-weight: 600; font-size: 30px; letter-spacing: 1px; color: #E3C16F; }
#step span { position: absolute; left: 0; bottom: 0; white-space: nowrap; opacity: 0; }
#title { position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; opacity: 0; text-shadow: 0 6px 40px rgba(0,0,0,.6); }
#title b { display: block; font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500; font-size: 120px; line-height: 1.2; }
#title span { display: block; margin-top: 6px; font-size: 32px; font-weight: 600; letter-spacing: 3px; color: #E3C16F; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 90% 85% at 50% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%); }
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="16.5" data-width="1920" data-height="1080">
  <div id="map"></div><div id="mapshade"></div>
  <div id="bp"></div>
  <div id="pin"><i></i></div>
  <div id="stage"><div id="world">
    <div id="lawn"></div>
    <svg id="plan" viewBox="0 0 1400 900">
      <rect class="ln" id="lot" x="300" y="180" width="800" height="580" />
      <rect class="ln" id="fp" x="420" y="330" width="520" height="240" />
      <rect class="thin" id="poolp" x="560" y="628" width="340" height="104" />
      <line class="thin" id="d1" x1="420" y1="300" x2="940" y2="300" /><line class="thin" id="d2" x1="970" y1="330" x2="970" y2="570" />
      <text id="t1" x="640" y="290">18 m</text><text id="t2" x="985" y="460">9 m</text>
    </svg>
    <div id="pool"></div>
  </div></div>
  <div id="real"><video id="v1" class="clip" src="assets/real1.mp4" data-start="9.6" data-duration="5.0" data-track-index="1" muted playsinline></video></div>
  <div id="scan"></div>
  <div id="real2w"><video id="v2" class="clip" src="assets/real2.mp4" data-start="13.6" data-duration="2.9" data-track-index="2" muted playsinline></video></div>
  <div id="step"><span id="s1">Site plan</span><span id="s2">3D massing</span><span id="s3">Built</span></div>
  <div id="title"><b>Tropical Villa</b><span>FROM PLAN TO REAL HOME</span></div>
  <div id="vig"></div>
  <audio id="music" src="assets/music.mp3" data-start="0" data-duration="16.5" data-track-index="9" data-volume="0.85"></audio>
</div>
<script>
(function () {
  // build the villa as CSS 3D boxes on the plan (x, y, w, d in plan px; h and z0 in px up from the ground)
  const world = document.getElementById("world");
  function box(id, x, y, w, d, h, z0, cls) {
    const b = document.createElement("div"); b.className = "box " + (cls || ""); b.id = id;
    b.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${d}px;transform:translateZ(${z0}px)`;
    b.innerHTML = `<div class="bx">
      <div class="f t" style="width:${w}px;height:${d}px;transform:translateZ(${h}px)"></div>
      <div class="f fb" style="width:${w}px;height:${h}px;top:${d}px;transform-origin:0 0;transform:rotateX(90deg)"></div>
      <div class="f fb" style="width:${w}px;height:${h}px;top:0;transform-origin:0 0;transform:rotateX(90deg)"></div>
      <div class="f lr" style="width:${h}px;height:${d}px;left:0;transform-origin:0 0;transform:rotateY(-90deg)"></div>
      <div class="f lr" style="width:${h}px;height:${d}px;left:${w}px;transform-origin:0 0;transform:rotateY(-90deg)"></div></div>`;
    world.appendChild(b); return b;
  }
  box("g1", 420, 330, 520, 240, 120, 0, "glass");
  box("slab", 400, 315, 560, 270, 14, 120);
  box("g2", 470, 340, 470, 220, 115, 134, "glass");
  [440, 565, 690, 815].forEach((x, k) => box("p" + k, x, 556, 30, 30, 249, 0, "pillar"));
  box("roof", 380, 300, 610, 300, 16, 249);

  const tl = gsap.timeline({ paused: true });
  // 0-3 s: satellite zoom, pin, lot
  tl.fromTo("#map", { scale: 1 }, { scale: 4.6, duration: 3.0, ease: "power2.inOut" }, 0);
  tl.fromTo("#pin", { y: -80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(2.5)" }, 2.0);
  // 2.6-4.8 s: the plan draws over the map, the map turns into a blueprint grid
  const len = (id) => { const e = document.getElementById(id); return e.getTotalLength ? e.getTotalLength() : 2000; };
  ["lot", "fp", "poolp", "d1", "d2"].forEach((id, k) => {
    const L = len(id); tl.fromTo("#" + id, { strokeDasharray: id.startsWith("d") || id === "poolp" ? "8 8" : `${L} ${L}`, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 2.6 + k * 0.3);
  });
  tl.fromTo(["#t1", "#t2"], { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.15 }, 3.9);
  tl.to("#pin", { opacity: 0, duration: 0.3 }, 3.0);
  tl.to(["#map", "#mapshade"], { opacity: 0, duration: 1.0 }, 3.0);
  tl.fromTo("#bp", { opacity: 0 }, { opacity: 1, duration: 1.0 }, 3.0);
  tl.fromTo("#s1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, 2.8);
  // 4.8-6.2 s: the camera tilts the plan into 3D
  tl.fromTo("#world", { rotationX: 0, rotationZ: 0, scale: 1, y: 0 }, { rotationX: 58, rotationZ: -30, scale: 1.08, y: 70, duration: 1.4, ease: "power3.inOut" }, 4.8);
  tl.to("#s1", { opacity: 0, y: -20, duration: 0.3 }, 5.4); tl.fromTo("#s2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, 5.6);
  // 6.0-8.8 s: build it, piece by piece
  // every piece is hidden until the moment it rises
  tl.set(".box", { opacity: 0 }, 0);
  const rise = (sel, t, d, ease) => { tl.set(sel, { opacity: 1 }, t); tl.fromTo(sel + " .bx", { scaleZ: 0.001 }, { scaleZ: 1, duration: d, ease: ease || "power3.out", immediateRender: false }, t); };
  tl.to(["#t1", "#t2", "#d1", "#d2"], { opacity: 0, duration: 0.3 }, 5.7);
  rise("#g1", 6.0, 0.7);
  rise("#slab", 6.6, 0.3, "power2.out");
  rise("#g2", 6.85, 0.7);
  [0, 1, 2, 3].forEach(k => rise(`#p${k}`, 7.35 + k * 0.1, 0.5));
  tl.set("#roof", { opacity: 1 }, 7.9);
  tl.fromTo("#roof", { z: 560 }, { z: 249, duration: 0.6, ease: "bounce.out", immediateRender: false }, 7.9);
  tl.fromTo("#lawn", { opacity: 0 }, { opacity: 0.85, duration: 0.6 }, 8.2);
  tl.fromTo("#pool", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out" }, 8.4);
  // 8.8-10.0 s: orbit to the front, like the real camera
  tl.to("#world", { rotationX: 70, rotationZ: -14, scale: 1.5, y: 170, x: 40, duration: 1.3, ease: "power2.inOut" }, 8.7);
  tl.to("#s2", { opacity: 0, y: -20, duration: 0.3 }, 9.6); tl.fromTo("#s3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, 9.8);
  // 10.0-11.3 s: a scan turns the model into the real house
  tl.fromTo("#real", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.3, ease: "power2.inOut" }, 10.0);
  tl.fromTo("#scan", { x: 0, opacity: 1 }, { x: 1930, opacity: 1, duration: 1.3, ease: "power2.inOut" }, 10.0);
  tl.to("#scan", { opacity: 0, duration: 0.15 }, 11.3);
  tl.to("#s3", { opacity: 0, duration: 0.3 }, 11.4);
  tl.fromTo("#v1", { scale: 1.0 }, { scale: 1.08, duration: 5, ease: "none" }, 9.6);
  // 11.8-16.5 s: the real house, name
  tl.fromTo("#title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 11.9);
  tl.to("#title", { opacity: 0, duration: 0.4 }, 13.3);
  tl.set("#real2w", { opacity: 1 }, 13.6);
  tl.fromTo("#v2", { scale: 1.1 }, { scale: 1.0, duration: 2.9, ease: "none" }, 13.6);
  tl.to("#title", { opacity: 1, duration: 0.6 }, 14.6);
  tl.to({}, { duration: 0.01 }, 16.49);
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
})();
</script></body></html>
