<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face { font-family: 'Be Vietnam Pro'; font-style: normal; font-weight: 300; font-display: block; src: url(assets/fonts/f02.woff2) format('woff2'); }
@font-face { font-family: 'Be Vietnam Pro'; font-style: normal; font-weight: 700; font-display: block; src: url(assets/fonts/f05.woff2) format('woff2'); }

/* "How big is the Sun?" 9:16, 17 s, music only.
   Facts (NASA): the Sun's diameter is about 109 times Earth's; about 1.3 million Earths would fit inside it;
   sunlight takes about 8 minutes (8 min 20 s) to reach Earth.
   Scale graphic is true to ratio: Earth 9 px wide, Sun 981 px wide (109 x 9). The 109 small discs are Earths. */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #03040a; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #03040a; color: #fff; font-family: 'Be Vietnam Pro', sans-serif; }
.sc { position: absolute; inset: 0; overflow: hidden; }
.clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#S2 { opacity: 0; } #S3 { opacity: 0; }
.dim { position: absolute; inset: 0; }
#dim1 { background: linear-gradient(180deg, rgba(3,4,10,.78) 0%, rgba(3,4,10,.35) 30%, rgba(3,4,10,0) 48%); }
#dim2 { background: rgba(3,4,10,.62); }
#dim3 { background: linear-gradient(180deg, rgba(20,8,0,0) 50%, rgba(20,8,0,.55) 72%, rgba(20,8,0,.72) 100%); }
/* scale graphic */
#gfx { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0; }
#row .e { opacity: 0; }
#gfx svg { position: absolute; left: 0; top: 0; overflow: visible; }
#lblE { position: absolute; left: 0; right: 0; top: 820px; text-align: center; font-weight: 300; font-size: 44px; letter-spacing: .12em; opacity: 0; }
/* type */
.t { position: absolute; left: 90px; right: 90px; text-align: center; }
.t b { display: block; font-weight: 700; line-height: 1.18; letter-spacing: -.01em; }
.t span { display: block; font-weight: 300; line-height: 1.3; color: rgba(255,255,255,.88); }
#t1 { top: 250px; } #t1 b { font-size: 104px; }
#t2, #t3 { top: 250px; } #t2 b, #t3 b { font-size: 120px; } #t2 span, #t3 span { font-size: 50px; margin-top: 8px; }
#t4 { top: 1120px; } #t4 span { font-size: 50px; } #t4 b { font-size: 170px; margin: 4px 0; }
#t1, #t2, #t3, #t4 { opacity: 0; }
#fadeK { position: absolute; inset: 0; background: #03040a; opacity: 0; }
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="17" data-width="1080" data-height="1920">
  <div class="sc" id="S1"><video id="v1" class="clip" src="assets/s1.mp4" data-start="0" data-duration="4.7" data-track-index="1" muted playsinline></video><div class="dim" id="dim1"></div></div>
  <div class="sc" id="S2"><video id="v2" class="clip" src="assets/s2.mp4" data-start="4.3" data-duration="6.9" data-track-index="2" muted playsinline></video><div class="dim" id="dim2"></div></div>
  <div id="gfx">
    <div id="zoom" style="position:absolute;left:0;top:0;width:1080px;height:1920px;">
      <svg width="1080" height="1920" viewBox="0 0 1080 1920">
        <defs>
          <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff1c4"/><stop offset="55%" stop-color="#ffc35a"/>
            <stop offset="85%" stop-color="#ff8f2e"/><stop offset="100%" stop-color="#e8641c"/>
          </radialGradient>
          <radialGradient id="earthG" cx="38%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#9fd3ff"/><stop offset="60%" stop-color="#2f7fd6"/><stop offset="100%" stop-color="#173f7a"/>
          </radialGradient>
        </defs>
        <circle id="sun" cx="540" cy="1180" r="490.5" fill="url(#sunG)"/>
        <g id="row"></g>
        <circle id="earth" cx="540" cy="580" r="4.5" fill="url(#earthG)"/>
      </svg>
    </div>
    <div id="lblE">EARTH</div>
  </div>
  <div class="sc" id="S3"><video id="v3" class="clip" src="assets/s3.mp4" data-start="10.4" data-duration="6.6" data-track-index="3" muted playsinline></video><div class="dim" id="dim3"></div></div>
  <div class="t" id="t1"><b>How big is<br>the Sun?</b></div>
  <div class="t" id="t2"><b>109&times;</b><span>wider than Earth</span></div>
  <div class="t" id="t3"><b>1.3 million</b><span>Earths would fit inside</span></div>
  <div class="t" id="t4"><span>Its light takes about</span><b>8 min</b><span>to reach us</span></div>
  <div id="fadeK"></div>
  <audio id="music" src="assets/music.mp3" data-start="0" data-duration="17" data-track-index="9" data-volume="0.85"></audio>
</div>
<script>
(function () {
  // 109 Earths (9 px each) laid edge to edge across the Sun's diameter
  const NS = "http://www.w3.org/2000/svg", row = document.getElementById("row");
  for (let i = 0; i < 109; i++) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", 49.5 + 4.5 + i * 9); c.setAttribute("cy", 1180); c.setAttribute("r", 4.1);
    c.setAttribute("fill", "#2a6fc4"); c.setAttribute("class", "e"); row.appendChild(c);
  }

  const tl = gsap.timeline({ paused: true });
  const IR = { immediateRender: false };
  const inT = (id, t) => tl.fromTo(id, { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out", ...IR }, t);
  const outT = (id, t) => tl.to(id, { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, t);

  // 0-4.3 Earth from orbit, slow drift; the question
  tl.fromTo("#v1", { scale: 1.12 }, { scale: 1.0, duration: 4.7, ease: "none" }, 0);
  inT("#t1", 0.5);
  outT("#t1", 3.85);

  // 4.3-10.6 scale graphic over the night sky
  tl.set("#S2", { opacity: 1 }, 4.3);
  tl.set("#S1", { opacity: 0 }, 4.3);
  tl.fromTo("#v2", { scale: 1.06 }, { scale: 1.0, duration: 6.9, ease: "none" }, 4.3);
  tl.set("#gfx", { opacity: 1 }, 4.3);
  // start zoomed on Earth (x12), then pull back to reveal the Sun at true scale
  tl.set("#zoom", { transformOrigin: "540px 580px", scale: 12, y: 380 }, 4.3);
  tl.fromTo("#earth", { scale: 0.6, opacity: 0, svgOrigin: "540 580" }, { scale: 1, opacity: 1, duration: 0.6, ease: "expo.out", ...IR }, 4.35);
  tl.fromTo("#lblE", { opacity: 0, y: 16 }, { opacity: 0.9, y: 0, duration: 0.5, ease: "power3.out", ...IR }, 4.55);
  tl.to("#lblE", { opacity: 0, duration: 0.25 }, 5.45);
  tl.to("#zoom", { scale: 1, y: 0, duration: 1.5, ease: "expo.inOut" }, 5.5);
  inT("#t2", 6.8);
  // Earths fill the diameter, left to right
  tl.fromTo("#row .e", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out", stagger: 0.009, ...IR }, 7.0);
  outT("#t2", 8.55);
  tl.to("#row .e", { opacity: 0, duration: 0.4 }, 8.6);
  inT("#t3", 8.85);
  outT("#t3", 10.05);
  // the drawn Sun travels into the real Sun of the next shot
  tl.to("#earth", { opacity: 0, duration: 0.3 }, 10.0);
  tl.to("#zoom", { scale: 0.25, x: -40, y: -230, duration: 0.75, ease: "expo.inOut" }, 10.0);
  tl.fromTo("#S3", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.inOut", ...IR }, 10.45);
  tl.to("#gfx", { opacity: 0, duration: 0.35 }, 10.6);
  tl.set("#S2", { opacity: 0 }, 11.0);

  // 10.4-17 sunrise above the clouds: the light-travel fact
  tl.fromTo("#v3", { scale: 1.0 }, { scale: 1.08, duration: 6.6, ease: "none" }, 10.4);
  inT("#t4", 11.3);
  tl.to("#fadeK", { opacity: 1, duration: 1.0, ease: "power1.in" }, 15.95);
  tl.to({}, { duration: 0.01 }, 16.99);
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
})();
</script></body></html>
