<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face { font-family: 'Be Vietnam Pro'; font-weight: 400; font-display: block; src: url(assets/fonts/f02.woff2) format('woff2'); }
@font-face { font-family: 'Be Vietnam Pro'; font-weight: 600; font-display: block; src: url(assets/fonts/f05.woff2) format('woff2'); }
@font-face { font-family: 'Be Vietnam Pro'; font-weight: 800; font-display: block; src: url(assets/fonts/f08.woff2) format('woff2'); }
@font-face { font-family: 'Playfair Display'; font-style: italic; font-weight: 500; font-display: block; src: url(assets/fonts/f12.woff2) format('woff2'); }

/* Apartment tour on a floor plan: a camera marker walks the plan room to room; each room's real footage
   opens out of the marker's view cone. The plan shrinks to a corner inset after the first room. Music only. */
:root { --paper: #F2EEE7; --ink: #2A2926; --soft: #9A948A; --bronze: #A97B4F; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); font-family: 'Be Vietnam Pro', sans-serif; }
.room { position: absolute; inset: 0; opacity: 0; }
.room video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#card { position: absolute; left: 360px; top: 160px; width: 1200px; height: 760px; transform-origin: 0 0; z-index: 20; }
#panel { position: absolute; inset: 0; background: var(--paper); border-radius: 6px; opacity: 0; box-shadow: 0 18px 50px rgba(0,0,0,.28); }
#plan { position: absolute; inset: 0; width: 1200px; height: 760px; overflow: visible; }
#plan .wo { fill: none; stroke: var(--ink); stroke-width: 7; stroke-linecap: square; }
#plan .wi { fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: square; }
#plan .win { fill: none; stroke: var(--paper); stroke-width: 4; }
#plan .winl { fill: none; stroke: var(--ink); stroke-width: 1.2; }
#plan .fur { fill: none; stroke: var(--soft); stroke-width: 1.6; }
#plan .door { fill: none; stroke: var(--soft); stroke-width: 1.4; }
#plan .rf { fill: var(--bronze); opacity: 0; }
#plan text { font: 600 30px 'Be Vietnam Pro'; letter-spacing: 3.5px; fill: var(--ink); text-anchor: middle; }
#plan text.mn { font-size: 19px; fill: #6C6861; }
#lock { position: absolute; left: 0; right: 0; bottom: 0; height: 520px; z-index: 30; opacity: 0;
  background: linear-gradient(to top, rgba(14,12,10,.72) 0%, rgba(14,12,10,.35) 45%, rgba(14,12,10,0) 100%); }
#lock b { position: absolute; left: 0; right: 0; bottom: 150px; text-align: center; color: #F6F1E9; font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500; font-size: 104px; line-height: 1.2; }
#lock span { position: absolute; left: 0; right: 0; bottom: 98px; text-align: center; color: #E4D3BC; font-weight: 600; font-size: 27px; letter-spacing: 7px; }
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="17.6" data-width="1920" data-height="1080">
  <div class="room" id="r1"><video id="v1" class="clip" src="assets/living.mp4" data-start="2.0" data-duration="4.0" data-media-start="0" data-track-index="1" muted playsinline></video></div>
  <div class="room" id="r2"><video id="v2" class="clip" src="assets/dining.mp4" data-start="5.2" data-duration="3.7" data-media-start="0" data-track-index="2" muted playsinline></video></div>
  <div class="room" id="r3"><video id="v3" class="clip" src="assets/kitchen.mp4" data-start="8.1" data-duration="3.7" data-media-start="0" data-track-index="3" muted playsinline></video></div>
  <div class="room" id="r4"><video id="v4" class="clip" src="assets/bedroom.mp4" data-start="11.0" data-duration="3.8" data-media-start="0" data-track-index="4" muted playsinline></video></div>
  <div class="room" id="r5"><video id="v5" class="clip" src="assets/living2.mp4" data-start="14.0" data-duration="3.6" data-media-start="0" data-track-index="5" muted playsinline></video></div>

  <div id="card">
    <div id="panel"></div>
    <svg id="plan" viewBox="0 0 1200 760">
      <!-- room tints: light up while the camera is in that room -->
      <rect class="rf" id="f-living" x="300" y="360" width="560" height="340" />
      <rect class="rf" id="f-dining" x="440" y="60" width="320" height="300" />
      <rect class="rf" id="f-kitchen" x="760" y="60" width="380" height="300" />
      <rect class="rf" id="f-bed" x="60" y="60" width="380" height="300" />
      <!-- furniture, faint: tells the rooms apart at a glance -->
      <g id="fur" class="fur">
        <rect x="130" y="110" width="200" height="220" rx="6" /><line x1="130" y1="150" x2="330" y2="150" />
        <rect x="520" y="150" width="160" height="90" rx="4" />
        <path d="M800 80 H1120 V200" /><path d="M800 110 H1090 V200" /><rect x="900" y="250" width="130" height="60" rx="4" />
        <path d="M380 560 V660 H660 V630 H410 V560 Z" /><rect x="470" y="510" width="120" height="70" rx="4" />
        <rect x="80" y="400" width="200" height="70" rx="20" />
        <rect x="920" y="400" width="150" height="100" rx="5" /><rect x="920" y="570" width="150" height="100" rx="5" />
      </g>
      <!-- doors -->
      <g class="door">
        <path d="M60 650 A80 80 0 0 1 140 570" /><line x1="60" y1="570" x2="140" y2="570" />
        <path d="M440 310 A80 80 0 0 1 360 230" />
        <path d="M760 290 A90 90 0 0 0 850 200" />
        <path d="M180 360 A70 70 0 0 0 250 430" />
        <path d="M860 490 A70 70 0 0 1 930 420" /><path d="M860 660 A70 70 0 0 1 930 590" />
      </g>
      <!-- walls -->
      <path id="wo" class="wo" d="M60 570 V60 H1140 V700 H60 V650" />
      <path id="wi" class="wi" d="M60 360 H180 M250 360 H480 M720 360 H1140 M440 60 V230 M440 310 V360 M760 60 V200 M760 290 V360 M300 360 V560 M300 660 V700 M60 520 H300 M860 360 V420 M860 490 V590 M860 660 V700 M860 530 H1140" />
      <!-- windows -->
      <g id="wins">
        <line class="win" x1="150" y1="60" x2="330" y2="60" /><line class="winl" x1="150" y1="57" x2="330" y2="57" /><line class="winl" x1="150" y1="63" x2="330" y2="63" />
        <line class="win" x1="520" y1="60" x2="680" y2="60" /><line class="winl" x1="520" y1="57" x2="680" y2="57" /><line class="winl" x1="520" y1="63" x2="680" y2="63" />
        <line class="win" x1="880" y1="60" x2="1060" y2="60" /><line class="winl" x1="880" y1="57" x2="1060" y2="57" /><line class="winl" x1="880" y1="63" x2="1060" y2="63" />
        <line class="win" x1="420" y1="700" x2="780" y2="700" /><line class="winl" x1="420" y1="697" x2="780" y2="697" /><line class="winl" x1="420" y1="703" x2="780" y2="703" />
        <line class="win" x1="1140" y1="410" x2="1140" y2="500" /><line class="winl" x1="1137" y1="410" x2="1137" y2="500" /><line class="winl" x1="1143" y1="410" x2="1143" y2="500" />
        <line class="win" x1="1140" y1="580" x2="1140" y2="670" /><line class="winl" x1="1137" y1="580" x2="1137" y2="670" /><line class="winl" x1="1143" y1="580" x2="1143" y2="670" />
      </g>
      <!-- room names -->
      <g id="labels">
        <text id="l-bed" x="250" y="222">BEDROOM</text>
        <text id="l-dining" x="600" y="290">DINING</text>
        <text id="l-kitchen" x="950" y="235">KITCHEN</text>
        <text id="l-living" x="580" y="470">LIVING</text>
        <text class="mn" data-layout-ignore x="180" y="500">BATH</text>
        <text class="mn" data-layout-ignore x="180" y="625">ENTRY</text>
        <text class="mn" data-layout-ignore x="1000" y="522">BEDROOM 2</text>
        <text class="mn" data-layout-ignore x="1000" y="692">BEDROOM 3</text>
      </g>
      <!-- camera marker + view cone -->
      <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A97B4F" stop-opacity=".72" /><stop offset="1" stop-color="#A97B4F" stop-opacity="0" /></linearGradient></defs>
      <g id="mk">
        <g id="cone"><path d="M0 0 L123.6 -65.7 A140 140 0 0 1 123.6 65.7 Z" fill="url(#cg)" /></g>
        <circle r="14" fill="#A97B4F" /><circle r="5.5" fill="#F2EEE7" />
      </g>
    </svg>
  </div>

  <div id="lock"><b>The Linden Residence</b><span>3 BR · 140 m²</span></div>
  <audio id="music" src="assets/music.mp3" data-start="0" data-duration="17.6" data-track-index="9" data-volume="0.9"></audio>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  const CONE_L = 140, HALF = 28 * Math.PI / 180;
  const FULL = { x: 360, y: 160, s: 1 }, INSET = { x: 64, y: 598, s: 0.55 };
  const r = (n) => Math.round(n * 10) / 10;
  // reveal polygon: the cone as it sits on screen, then the same triangle blown up past the frame
  function cone(mx, my, deg, P, k) {
    const a = deg * Math.PI / 180, L = CONE_L * P.s;
    const A = [P.x + mx * P.s, P.y + my * P.s];
    const B = [A[0] + L * Math.cos(a - HALF), A[1] + L * Math.sin(a - HALF)];
    const C = [A[0] + L * Math.cos(a + HALF), A[1] + L * Math.sin(a + HALF)];
    const g = [(A[0] + B[0] + C[0]) / 3, (A[1] + B[1] + C[1]) / 3];
    const big = (p) => [g[0] + (p[0] - g[0]) * k, g[1] + (p[1] - g[1]) * k];
    const s = (pts) => "polygon(" + pts.map(p => r(p[0]) + "px " + r(p[1]) + "px").join(", ") + ")";
    return [s([A, B, C]), s([big(A), big(B), big(C)])];
  }
  function reveal(id, vid, t, mx, my, deg, P, k, d) {
    const [c0, c1] = cone(mx, my, deg, P, k);
    tl.set(id, { opacity: 1, clipPath: c0 }, t);
    tl.fromTo(id, { clipPath: c0 }, { clipPath: c1, duration: d, ease: "power3.in", immediateRender: false }, t);
    tl.fromTo(vid, { scale: 1.12 }, { scale: 1.0, duration: 4.0, ease: "power2.out", immediateRender: false }, t);
  }
  const lit = (room, t) => {
    tl.to("#f-" + room, { opacity: 0.13, duration: 0.4 }, t);
    tl.to("#l-" + room, { fill: "#8E6440", duration: 0.4 }, t);
  };
  const unlit = (room, t) => {
    tl.to("#f-" + room, { opacity: 0, duration: 0.4 }, t);
    tl.to("#l-" + room, { fill: "#2A2926", duration: 0.4 }, t);
  };
  const walk = (pts, t, d) => tl.to("#mk", { keyframes: pts.map(p => ({ x: p[0], y: p[1], duration: d / pts.length, ease: "sine.inOut" })) }, t);
  const turn = (deg, t, d) => tl.to("#cone", { rotation: deg, svgOrigin: "0 0", duration: d, ease: "power2.inOut" }, t);

  // 0-1.6 s: the plan draws itself on paper
  const len = (id) => document.getElementById(id).getTotalLength();
  ["wo", "wi"].forEach((id, k) => { const L = len(id) + 10; tl.fromTo("#" + id, { strokeDasharray: L + " " + L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, 0.1 + k * 0.25); });
  tl.fromTo("#wins", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.0);
  tl.fromTo(["#fur", ".door"], { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.0);
  tl.fromTo("#labels text", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.05, ease: "power2.out" }, 1.1);
  tl.fromTo("#card", { scale: 0.96, x: 24, y: 15 }, { scale: 1, x: 0, y: 0, duration: 2.0, ease: "power2.out" }, 0);
  // 1.3-2.0 s: the camera comes in through the front door and looks into the living room
  tl.set("#mk", { x: 110, y: 610 }, 0); tl.set("#cone", { rotation: 0, svgOrigin: "0 0" }, 0);
  tl.fromTo("#mk", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 1.3);
  walk([[300, 610], [500, 590]], 1.45, 0.6);
  turn(-40, 1.6, 0.5);
  lit("living", 1.7);
  // 2.0 s: living room opens out of the cone, then the plan tucks into the corner
  reveal("#r1", "#v1", 2.0, 500, 590, -40, FULL, 90, 0.75);
  tl.to("#card", { x: INSET.x - FULL.x, y: INSET.y - FULL.y, scale: INSET.s, duration: 0.9, ease: "power3.inOut" }, 2.55);
  tl.to("#panel", { opacity: 0.95, duration: 0.5 }, 2.75);
  // dining
  walk([[600, 420], [600, 300]], 4.4, 0.7); turn(-90, 4.5, 0.5); unlit("living", 4.6); lit("dining", 4.8);
  reveal("#r2", "#v2", 5.2, 600, 300, -90, INSET, 150, 0.7);
  // kitchen
  walk([[700, 245], [900, 245]], 7.3, 0.7); turn(0, 7.3, 0.5); unlit("dining", 7.5); lit("kitchen", 7.7);
  reveal("#r3", "#v3", 8.1, 900, 245, 0, INSET, 150, 0.7);
  // bedroom
  turn(180, 10.1, 0.45);
  walk([[600, 270], [440, 270], [300, 230]], 10.2, 0.8); unlit("kitchen", 10.4); lit("bed", 10.6);
  reveal("#r4", "#v4", 11.0, 300, 230, 180, INSET, 150, 0.7);
  // back to the living room for the last look
  walk([[440, 270], [600, 300], [600, 450], [460, 620]], 13.2, 0.8); turn(335, 13.3, 0.6); unlit("bed", 13.4); lit("living", 13.6);
  reveal("#r5", "#v5", 14.0, 460, 620, 335, INSET, 150, 0.7);
  // 14.7 s: plan steps away, name
  tl.to("#card", { opacity: 0, y: "+=30", duration: 0.5, ease: "power2.in" }, 14.8);
  tl.fromTo("#lock", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 15.0);
  tl.fromTo("#lock b", { y: 24 }, { y: 0, duration: 1.0, ease: "power3.out" }, 15.0);
  tl.fromTo("#lock span", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 15.4);
  tl.to({}, { duration: 0.01 }, 17.59);
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
})();
</script></body></html>
