[[6.6, -0.2, 3.4, 1.5], [-6.4, -0.3, 3.8, 1.2], [5.2, -0.2, -4.6, 1.8], [8.8, -0.4, 0.4, 1.0], [-8.2, -0.4, -1.2, 1.4], [-2.5, -0.4, 6.4, 0.9]].forEach((r, i) => {

const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true, fog: false, emissive: new THREE.Color(0x000000) });

[[-48, 62, -260, 1.0], [40, 78, -300, 1.3], [-10, 96, -330, 0.9], [72, 54, -250, 0.7], [-85, 84, -290, 1.1], [15, 48, -240, 0.6]].forEach(([x, y, z, s], i) => {
  const g = new THREE.Group(); g.position.set(x, y, z); g.scale.setScalar(s); scene.add(g); clouds.push(g);

});
// ---------- sailboat ----------
const boat = new THREE.Group(); scene.add(boat);
{
  const shape = new THREE.Shape(); shape.moveTo(-1.6, 0.35); shape.lineTo(1.9, 0.35); shape.lineTo(1.2, -0.3); shape.lineTo(-1.2, -0.3); shape.closePath();
  const hg = new THREE.ExtrudeGeometry(shape, { depth: 0.9, bevelEnabled: false }); hg.translate(0, 0, -0.45);
  boat.add(new THREE.Mesh(hg, std(0x6b3b2c)));
  const deck = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.06, 0.8), std(0xc9a77a)); deck.position.y = 0.37; boat.add(deck);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 3.9, 5), std(0x3a2b22)); mast.position.set(0.1, 2.3, 0); boat.add(mast);
  const sailG = new THREE.BufferGeometry(); sailG.setAttribute("position", new THREE.Float32BufferAttribute([0.18, 0.7, 0, 0.18, 4.1, 0, 1.9, 0.75, 0, 0.0, 0.8, 0, 0.0, 3.6, 0, -1.3, 0.8, 0], 3)); sailG.computeVertexNormals();
  const sail = new THREE.Mesh(sailG, std(0xf4ead7, { side: THREE.DoubleSide })); boat.add(sail);
}
const boatLampMat = new THREE.MeshBasicMaterial({ color: 0xffc56e, transparent: true, opacity: 0 });
const boatLamp = new THREE.Mesh(new THREE.IcosahedronGeometry(0.11, 0), boatLampMat); boatLamp.position.set(-1.45, 0.75, 0); boat.add(boatLamp);
boat.scale.setScalar(1.25);
function updateBoat(t) {
  const x = lerp(20, -16, t / DUR), z = -26;
  const y = waveH(x, z, t); const dx = (waveH(x + 1, z, t) - waveH(x - 1, z, t)) / 2, dz = (waveH(x, z + 1, t) - waveH(x, z - 1, t)) / 2;
  boat.position.set(x, y + 0.05, z); boat.rotation.set(-dz * 0.8, Math.PI, -dx * 0.8);

// ---------- seagulls ----------
const gullMat = std(0xf3f0ea, { side: THREE.DoubleSide, roughness: 0.9 }); const tipMat = std(0x55565e, { side: THREE.DoubleSide });
const gulls = [];
for (let i = 0; i < 5; i++) {
  const g = new THREE.Group(); scene.add(g);
  const bodyM = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.7, 5), gullMat); bodyM.rotation.x = Math.PI / 2; g.add(bodyM);
  const wings = [];
  for (const s of [1, -1]) {

    const inner = new THREE.BufferGeometry(); inner.setAttribute("position", new THREE.Float32BufferAttribute([0, 0, 0.18, 0, 0, -0.12, s * 0.55, 0, -0.02], 3)); inner.computeVertexNormals();
    piv.add(new THREE.Mesh(inner, gullMat));
    const op = new THREE.Group(); op.position.set(s * 0.55, 0, 0); piv.add(op);
    const outer = new THREE.BufferGeometry(); outer.setAttribute("position", new THREE.Float32BufferAttribute([0, 0, 0.1, 0, 0, -0.14, s * 0.5, 0, -0.16], 3)); outer.computeVertexNormals();
    op.add(new THREE.Mesh(outer, tipMat));

}
function updateGulls(t) {
  for (const q of gulls) {
    const leave = Math.max(0, t - 5.5);
    const a = q.ph + q.sp * t; const r = q.r0 + leave * leave * 0.9; const y = q.h0 + Math.sin(t * 0.5 + q.ph) * 0.5 + leave * leave * 0.25;
    q.g.position.set(LH.x + Math.cos(a) * r, y, LH.z + Math.sin(a) * r);
    q.g.rotation.set(0, -a, 0); q.g.rotateZ(-0.35); // heading tangent, banked into the turn
    const glide = 0.5 + 0.5 * Math.sin(t * 0.9 + q.fl);
    const flap = Math.sin(t * 11 + q.fl) * 0.55 * smooth(0.35, 0.7, glide);
    for (const w of q.wings) { w.piv.rotation.z = w.s * (flap + 0.12); w.op.rotation.z = w.s * flap * 0.6; }
    q.g.visible = r < 60;
  }
}

// ---------- the beam (the one glow in the film) ----------
const BL = 60, BR = 6.2;
const beamGeo = new THREE.ConeGeometry(BR, BL, 40, 1, true); beamGeo.translate(0, -BL / 2, 0); beamGeo.rotateZ(Math.PI / 2);
const beamMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, fog: false,
  uniforms: { uI: { value: 0 }, uT: { value: 0 }, uCol: { value: new THREE.Color(1.0, 0.86, 0.62) } },
  vertexShader: `varying float vAlong; varying vec3 vN; varying vec3 vV; varying vec3 vW;
    void main(){ vAlong = length(position) / ${BL.toFixed(1)}; vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz;
      vN = normalize(mat3(modelMatrix) * normal); vV = normalize(cameraPosition - w.xyz); gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float uI,uT; uniform vec3 uCol; varying float vAlong; varying vec3 vN; varying vec3 vV; varying vec3 vW;
    void main(){ float edge = abs(dot(normalize(vN), normalize(vV))); edge = pow(clamp(edge, 0.0, 1.0), 1.4);
      float fall = pow(clamp(1.0 - vAlong, 0.0, 1.0), 1.7) * smoothstep(0.0, 0.04, vAlong);
      float mist = 0.72 + 0.28 * sin(vW.x * 0.35 + uT * 0.6) * sin(vW.z * 0.42 - uT * 0.45 + vW.y * 0.6);
      float a = uI * fall * edge * mist * 0.62; gl_FragColor = vec4(uCol * a, a); }`,

const beamRig = new THREE.Group(); beamRig.position.copy(lampPos); scene.add(beamRig);
const beams = [0, Math.PI].map((r) => { const m = new THREE.Mesh(beamGeo, beamMat); m.rotation.set(0, r, -0.035); m.renderOrder = 5; beamRig.add(m); return m; });
const coreTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d"); const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, "rgba(255,246,225,1)"); g.addColorStop(0.18, "rgba(255,214,150,0.55)"); g.addColorStop(0.5, "rgba(255,180,100,0.12)"); g.addColorStop(1, "rgba(255,160,80,0)"); x.fillStyle = g; x.fillRect(0, 0, 128, 128); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const core = new THREE.Sprite(new THREE.SpriteMaterial({ map: coreTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, opacity: 0 }));

const LAMP_ON = 6.2;

// ---------- camera ----------
const camT = new THREE.Vector3();

}

// ---------- render ----------
const tmp = new THREE.Vector3();
