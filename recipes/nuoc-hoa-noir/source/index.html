/* Perfume reel, 9:16, 16 s, music only: hairline kinetic type -> slat reveal -> bento grid that one card escapes from
   -> close-ups cut on the beat -> name lockup. Brand name is fictional. */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #050607; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #050607; font-family: 'Be Vietnam Pro', sans-serif; color: #EEF1EF; }
.clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.full { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
#rain { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-weight: 200; font-size: 330px; letter-spacing: -6px; line-height: 1.2; }
#rain span { display: inline-block; opacity: 0; }
#rainsub { position: absolute; left: 0; right: 0; top: 1200px; text-align: center; font-family: 'Playfair Display', serif; font-style: italic; font-size: 46px; opacity: 0; color: #B9D8CF; }
#hair { position: absolute; left: 140px; top: 1170px; width: 800px; height: 1px; background: #B9D8CF; transform-origin: 0 50%; }
.slat { position: absolute; top: 0; height: 1920px; width: 360px; overflow: hidden; opacity: 0; }
.slat video { position: absolute; top: 0; height: 1920px; width: 1080px; object-fit: cover; max-width: none; }
#bento { position: absolute; inset: 0; opacity: 0; }
.card { position: absolute; border-radius: 34px; overflow: hidden; background: #0d1112; box-shadow: 0 30px 60px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06); }
.card video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card.txt { background: #B9D8CF; color: #071012; display: flex; flex-direction: column; justify-content: flex-end; padding: 34px; }
.card.txt b { font-weight: 700; font-size: 92px; letter-spacing: -3px; line-height: 1.2; }
.card.txt span { font-weight: 500; font-size: 26px; letter-spacing: 4px; }
#flashbar { position: absolute; inset: 0; pointer-events: none; }
#flashbar i { position: absolute; top: 0; height: 1920px; width: 216px; background: #050607; transform-origin: 50% 0; transform: scaleY(0); }
#lock { position: absolute; left: 0; right: 0; top: 1290px; text-align: center; opacity: 0; }
#lock b { display: block; font-weight: 200; font-size: 170px; letter-spacing: 40px; margin-right: -40px; line-height: 1.2; }
#lock em { display: block; font-family: 'Playfair Display', serif; font-style: italic; font-size: 54px; color: #B9D8CF; margin-top: 6px; }
#lock span { display: block; margin-top: 26px; font-weight: 500; font-size: 26px; letter-spacing: 10px; color: rgba(238,241,239,.7); }
#shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,6,7,0) 45%, rgba(5,6,7,.85) 100%); opacity: 0; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 90% 80% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
#grain { position: absolute; left: -60px; top: -60px; width: 1200px; height: 2040px; opacity: .07; pointer-events: none; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>"); }
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
  <!-- 0-2.2 hairline type -->
  <div id="rain"><span>R</span><span>A</span><span>I</span><span>N</span></div><div id="hair"></div><div id="rainsub">the scent of a rainy night</div>
  <!-- 2.0-5.0 slat reveal -->
  <div class="slat" id="sl0" style="left:0"><video id="sv0" src="assets/c01.mp4" data-start="1.9" data-duration="3.4" data-track-index="1" muted playsinline style="left:0"></video></div>
  <div class="slat" id="sl1" style="left:360px"><video id="sv1" src="assets/c01.mp4" data-start="1.9" data-duration="3.4" data-track-index="2" muted playsinline style="left:-360px"></video></div>
  <div class="slat" id="sl2" style="left:720px"><video id="sv2" src="assets/c01.mp4" data-start="1.9" data-duration="3.4" data-track-index="3" muted playsinline style="left:-720px"></video></div>
  <!-- 5.0-9.0 bento -->
  <div id="bento">
    <div class="card" id="k0" style="left:60px;top:150px;width:600px;height:820px"><video id="kv0" src="assets/c02.mp4" data-start="4.8" data-duration="4.6" data-track-index="4" muted playsinline></video></div>
    <div class="card txt" id="k1" style="left:690px;top:150px;width:330px;height:390px"><b>No.07</b><span>EAU DE PARFUM</span></div>
    <div class="card" id="k2" style="left:690px;top:570px;width:330px;height:400px"><video id="kv2" src="assets/c07.mp4" data-start="4.8" data-duration="4.4" data-track-index="5" muted playsinline></video></div>
    <div class="card" id="k3" style="left:60px;top:1000px;width:330px;height:420px"><video id="kv3" src="assets/c05.mp4" data-start="4.8" data-duration="4.4" data-track-index="6" muted playsinline></video></div>
    <div class="card" id="k4" style="left:420px;top:1000px;width:600px;height:420px"><video id="kv4" src="assets/c04.mp4" data-start="4.8" data-duration="5.0" data-track-index="7" muted playsinline></video></div>
    <div class="card" id="k5" style="left:60px;top:1450px;width:960px;height:320px"><video id="kv5" src="assets/c03.mp4" data-start="4.8" data-duration="4.4" data-track-index="8" muted playsinline style="object-position:50% 60%"></video></div>
  </div>
  <!-- 9.0-12.6 close-ups on the beat -->
  <div class="full" id="F1"><video id="fv1" class="clip" src="assets/c04.mp4" data-start="9.6" data-duration="1.3" data-media-start="4.8" data-track-index="1" muted playsinline></video></div>
  <div class="full" id="F2"><video id="fv2" class="clip" src="assets/c05.mp4" data-start="10.6" data-duration="1.3" data-media-start="2.0" data-track-index="2" muted playsinline style="object-position:35% 50%"></video></div>
  <div class="full" id="F3"><video id="fv3" class="clip" src="assets/c03.mp4" data-start="11.6" data-duration="4.4" data-media-start="1.0" data-track-index="3" muted playsinline></video></div>
  <div id="shade"></div>
  <div id="lock"><b>NOIR</b><em>Night Rain</em><span>NO.07 · EAU DE PARFUM</span></div>
  <div id="flashbar"><i style="left:0"></i><i style="left:216px"></i><i style="left:432px"></i><i style="left:648px"></i><i style="left:864px"></i></div>
  <div id="vig"></div><div id="grain"></div>
  <audio id="music" src="assets/music.mp3" data-start="0" data-duration="16" data-track-index="9" data-volume="0.95"></audio>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  // hairline type
  tl.fromTo("#rain span", { y: 60, opacity: 0, filter: "blur(18px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.9, stagger: 0.18, ease: "power3.out" }, 0.2);
  tl.fromTo("#hair", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "expo.inOut" }, 0.5);
  tl.fromTo("#rainsub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7 }, 1.0);
  tl.to(["#rain", "#rainsub", "#hair"], { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, 2.0);
  // slats slide in from alternating sides
  [0, 1, 2].forEach(k => {
    tl.set("#sl" + k, { opacity: 1 }, 2.0);
    tl.fromTo("#sl" + k, { yPercent: k % 2 ? 100 : -100 }, { yPercent: 0, duration: 0.8, ease: "expo.out", immediateRender: false }, 2.05 + k * 0.12);
  });
  tl.fromTo(["#sv0", "#sv1", "#sv2"], { scale: 1.18 }, { scale: 1.04, duration: 3.0, ease: "none" }, 2.0);
  // bento: the shot shrinks into cards
  tl.set("#bento", { opacity: 1 }, 4.9);
  ["#k0", "#k1", "#k2", "#k3", "#k4", "#k5"].forEach((k, i) => tl.fromTo(k, { scale: 0.6, opacity: 0, y: 80 }, { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.4)", immediateRender: false }, 4.95 + i * 0.09));
  tl.to(["#sl0", "#sl1", "#sl2"], { scale: 0.85, opacity: 0, duration: 0.5, ease: "power2.in" }, 4.85);
  tl.to("#bento", { y: -40, duration: 4, ease: "none" }, 5.0);
  // one card escapes to full screen (k4 grows), others fall away
  tl.to(["#k0", "#k1", "#k2", "#k3", "#k5"], { opacity: 0, scale: 0.9, duration: 0.4, stagger: 0.04, ease: "power2.in" }, 8.6);
  tl.to("#k4", { x: -180, y: -250, scale: 4.6, duration: 0.7, ease: "expo.inOut" }, 8.8);
  tl.set("#F1", { opacity: 1 }, 9.6); tl.set("#bento", { opacity: 0 }, 9.65);
  // close-ups on the beat, a shutter of black bars between them
  const shutter = t => { tl.fromTo("#flashbar i", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.14, stagger: 0.025, ease: "power2.in", immediateRender: false }, t - 0.2);
                         tl.to("#flashbar i", { scaleY: 0, transformOrigin: "50% 100%", duration: 0.16, stagger: 0.025, ease: "power2.out" }, t + 0.02); };
  shutter(10.6); tl.set("#F2", { opacity: 1 }, 10.6); tl.set("#F1", { opacity: 0 }, 10.62);
  shutter(11.6); tl.set("#F3", { opacity: 1 }, 11.6); tl.set("#F2", { opacity: 0 }, 11.62);
  tl.fromTo("#fv1", { scale: 1.25 }, { scale: 1.1, duration: 1.0, ease: "power2.out" }, 9.6);
  tl.fromTo("#fv2", { scale: 1.3 }, { scale: 1.12, duration: 1.0, ease: "power2.out" }, 10.6);
  tl.fromTo("#fv3", { scale: 1.2 }, { scale: 1.0, duration: 4.4, ease: "power1.out" }, 11.6);
  // lockup
  tl.fromTo("#shade", { opacity: 0 }, { opacity: 1, duration: 1 }, 12.3);
  tl.set("#lock", { opacity: 1 }, 12.5);
  tl.fromTo("#lock b", { scaleX: 1.35, opacity: 0, filter: "blur(14px)" }, { scaleX: 1, opacity: 1, filter: "blur(0px)", duration: 1.4, ease: "expo.out" }, 12.5);
  tl.fromTo("#lock em", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8 }, 13.1);
  tl.fromTo("#lock span", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 13.5);
  tl.fromTo("#grain", { x: 0, y: 0 }, { keyframes: { x: [0, -40, 30, -10, 40, 0], y: [0, 20, -30, 40, -20, 0] }, duration: 0.6, ease: "steps(6)", repeat: 26 }, 0);
  tl.to({}, { duration: 0.01 }, 15.99);
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
})();
</script></body></html>
