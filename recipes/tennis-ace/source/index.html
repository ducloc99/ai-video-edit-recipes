/* Sports reel, 9:16, 16 s, music only: face close-up -> slowed serve that freezes at the swing, the player cut out
   with a white glow line in front of a giant word -> ball on the strings -> three-panel split -> stuttered hit -> name.
   Brand ACE is fictional. */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #050608; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #050608; font-family: 'Be Vietnam Pro', sans-serif; color: #fff; --acc: #D7FF3A; }
.clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sc { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
.big { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Anton', sans-serif; text-transform: uppercase; line-height: 1.18; }
#w1 { top: 1440px; font-size: 150px; letter-spacing: 4px; opacity: 0; }
#w1 span { display: inline-block; }
#freeze { position: absolute; inset: 0; opacity: 0; }
#fbg { position: absolute; inset: 0; background: url(assets/freeze.png) center / cover; filter: brightness(.45) saturate(.6); }
#ace { top: 330px; font-size: 760px; color: var(--acc); letter-spacing: -10px; }
#cut { position: absolute; inset: 0; background: url(assets/cut.png) center / cover;
  filter: drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(0 0 30px rgba(255,255,255,.55)); }
#w2 { top: 760px; font-size: 230px; color: transparent; -webkit-text-stroke: 4px #fff; opacity: 0; }
.pan { position: absolute; top: 0; width: 356px; height: 1920px; overflow: hidden; }
.pan video { position: absolute; top: 0; left: -362px; width: 1080px; height: 1920px; object-fit: cover; max-width: none; }
#lock { position: absolute; left: 0; right: 0; top: 1300px; text-align: center; opacity: 0; }
#lock b { display: block; font-family: 'Anton', sans-serif; font-size: 300px; line-height: 1.18; color: var(--acc); }
#lock span { display: block; font-weight: 300; font-size: 48px; letter-spacing: 2px; }
#shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,6,8,0) 45%, rgba(5,6,8,.88) 100%); opacity: 0; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
  <div class="sc" id="A"><video id="va" class="clip" src="assets/t05.mp4" data-start="0" data-duration="2.9" data-track-index="1" muted playsinline></video></div>
  <div class="big" id="w1"><span>STAY</span> <span>FOCUSED</span></div>
  <div class="sc" id="B"><video id="vb" class="clip" src="assets/t07a.mp4" data-start="2.6" data-duration="2.0" data-track-index="2" muted playsinline></video></div>
  <div id="freeze"><div id="fbg"></div><div class="big" id="ace">ACE</div><div id="cut"></div></div>
  <div class="sc" id="B2"><video id="vb2" class="clip" src="assets/t07b.mp4" data-start="5.8" data-duration="0.6" data-track-index="3" muted playsinline></video></div>
  <div class="sc" id="C"><video id="vc" class="clip" src="assets/t14.mp4" data-start="6.2" data-duration="2.6" data-track-index="4" muted playsinline></video></div>
  <div class="big" id="w2">POWER</div>
  <div class="sc" id="D">
    <div class="pan" style="left:0"><video id="vd1" src="assets/t09.mp4" data-start="8.5" data-duration="3.0" data-track-index="5" muted playsinline></video></div>
    <div class="pan" style="left:362px"><video id="vd2" src="assets/t10.mp4" data-start="8.5" data-duration="3.0" data-track-index="6" muted playsinline></video></div>
    <div class="pan" style="left:724px"><video id="vd3" src="assets/t11.mp4" data-start="8.5" data-duration="3.0" data-track-index="7" muted playsinline></video></div>
  </div>
  <!-- stutter: the same hit three times, then it plays through -->
  <div class="sc" id="E1"><video id="ve1" class="clip" src="assets/t08.mp4" data-start="11.4" data-duration="0.4" data-media-start="0.3" data-track-index="1" muted playsinline></video></div>
  <div class="sc" id="E2"><video id="ve2" class="clip" src="assets/t08.mp4" data-start="11.8" data-duration="0.4" data-media-start="0.3" data-track-index="2" muted playsinline></video></div>
  <div class="sc" id="E3"><video id="ve3" class="clip" src="assets/t08.mp4" data-start="12.2" data-duration="1.3" data-media-start="0.3" data-track-index="3" muted playsinline></video></div>
  <div class="sc" id="F"><video id="vf" class="clip" src="assets/t02.mp4" data-start="13.4" data-duration="2.6" data-track-index="4" muted playsinline></video></div>
  <div id="shade"></div>
  <div id="lock"><b>ACE</b><span>Every shot has a purpose</span></div>
  <div id="flash"></div>
  <audio id="music" src="assets/music.mp3" data-start="0" data-duration="16" data-track-index="9" data-volume="0.9"></audio>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  const show = (id, t) => tl.set(id, { opacity: 1 }, t), hide = (id, t) => tl.set(id, { opacity: 0 }, t);
  const flash = t => tl.fromTo("#flash", { opacity: 0.7 }, { opacity: 0, duration: 0.18, immediateRender: false }, t);
  // face, focus
  show("#A", 0); tl.fromTo("#va", { scale: 1.15 }, { scale: 1.0, duration: 2.9, ease: "power1.out" }, 0);
  tl.set("#w1", { opacity: 1 }, 0.5);
  tl.fromTo("#w1 span", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, stagger: 0.25, ease: "expo.out" }, 0.5);
  tl.to("#w1", { opacity: 0, duration: 0.2 }, 2.45);
  // serve in slow motion, freeze at the swing
  show("#B", 2.6); hide("#A", 2.65); flash(2.6);
  tl.fromTo("#vb", { scale: 1.1 }, { scale: 1.0, duration: 2.0, ease: "none" }, 2.6);
  show("#freeze", 4.55); hide("#B", 4.6);
  tl.fromTo("#fbg", { scale: 1.0 }, { scale: 1.06, duration: 1.3, ease: "none" }, 4.55);
  tl.fromTo("#cut", { scale: 1.0 }, { scale: 1.09, duration: 1.3, ease: "power2.out" }, 4.55);
  tl.fromTo("#ace", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out", immediateRender: false }, 4.6);
  // the swing completes
  show("#B2", 5.8); hide("#freeze", 5.85); flash(5.8);
  // ball on the strings
  show("#C", 6.2); hide("#B2", 6.25);
  tl.fromTo("#vc", { scale: 1.25 }, { scale: 1.05, duration: 2.4, ease: "power2.out" }, 6.2);
  tl.fromTo("#w2", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, 6.9);
  tl.to("#w2", { scale: 1.08, duration: 1.3, ease: "none" }, 7.3); tl.to("#w2", { opacity: 0, duration: 0.15 }, 8.4);
  // three panels
  show("#D", 8.5); hide("#C", 8.9);
  tl.fromTo("#D .pan", { yPercent: (i) => (i % 2 ? -100 : 100) }, { yPercent: 0, duration: 0.5, stagger: 0.1, ease: "expo.out" }, 8.5);
  tl.to("#D .pan", { yPercent: (i) => (i % 2 ? 100 : -100), duration: 0.35, stagger: 0.06, ease: "power3.in" }, 11.1);
  // stutter hit
  show("#E1", 11.4); hide("#D", 11.5); flash(11.4);
  show("#E2", 11.8); hide("#E1", 11.82); tl.fromTo("#ve2", { scale: 1.12 }, { scale: 1.12, duration: 0.01 }, 11.8);
  show("#E3", 12.2); hide("#E2", 12.22); tl.fromTo("#ve3", { scale: 1.22 }, { scale: 1.0, duration: 1.2, ease: "power2.out" }, 12.2);
  // name
  show("#F", 13.4); hide("#E3", 13.45); flash(13.4);
  tl.fromTo("#vf", { scale: 1.1 }, { scale: 1.0, duration: 2.6, ease: "power1.out" }, 13.4);
  tl.fromTo("#shade", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 13.6);
  tl.set("#lock", { opacity: 1 }, 13.8);
  tl.fromTo("#lock b", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 13.8);
  tl.fromTo("#lock span", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6 }, 14.3);
  tl.to({}, { duration: 0.01 }, 15.99);
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
})();
</script></body></html>
