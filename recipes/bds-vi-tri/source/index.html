<script>
(function () {
  const T = window.TRK, FPS = 30;
  const at = (arr, t) => { // linear interpolation of a per-frame track at local time t
    const f = Math.max(0, Math.min(arr.length - 1, t * FPS)), i = Math.floor(f), j = Math.min(arr.length - 1, i + 1), k = f - i;

    gsap.set(id + " .lb", { x: ax - p[0], xPercent: -f * 100, transformOrigin: (f * 100).toFixed(1) + "% 100%" });
  };
  // point at fraction u along a cubic path (pure math, no DOM measurement)
  const cub = (a, b, c, d, t) => { const m = 1 - t; return m * m * m * a + 3 * m * m * t * b + 3 * m * t * t * c + t * t * t * d; };
  let SEG = [];
  const headAt = (u) => {
    const pts = [];
    SEG.forEach(([p1, c1, c2, p2], si) => { for (let k = si ? 1 : 0; k <= 24; k++) { const t = k / 24; pts.push([cub(p1[0], c1[0], c2[0], p2[0], t), cub(p1[1], c1[1], c2[1], p2[1], t)]); } });
    const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const target = cum[cum.length - 1] * u; let i = 1; while (i < cum.length - 1 && cum[i] < target) i++;
    const k = (target - cum[i - 1]) / Math.max(1e-6, cum[i] - cum[i - 1]);

  tl.fromTo("#pinTag .card b", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out", ...IR }, 1.25);
