/* Editorial luxury listing, 9:16, 17.25 s, music only. Ivory magazine page -> headline the footage shows through ->
   stem zoom to full frame -> spec line -> split-frame wipes (two rooms at once) -> villa folds back into a page window
   with the name lockup. Cuts sit on the track's 1.15 s grid. Property name is fictional. */
:root { --paper: #F1ECE4; --ink: #17130F; --brass: #A88B5C; --light: #F6F2EB; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); font-family: 'Manrope', sans-serif; color: var(--ink); }
video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; max-width: none; }
.layer { position: absolute; inset: 0; overflow: hidden; }

/* S1: knockout headline. Screen blend: black type shows the footage, ivory stays paper. */
#knock { position: absolute; inset: 0; background: var(--paper); mix-blend-mode: screen; }
#head { position: absolute; left: 110px; top: 330px; font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 330px; line-height: 1.18; letter-spacing: -8px; color: #000; }
#head .ln { display: block; overflow: hidden; height: 390px; }
#head .ln > span { display: inline-block; }
#stem { display: inline-block; }
#mast { position: absolute; left: 110px; right: 110px; top: 220px; display: flex; justify-content: space-between; font-weight: 500; font-size: 28px; letter-spacing: 7px; line-height: 1.3; color: var(--ink); padding-bottom: 22px; border-bottom: 1px solid rgba(23,19,15,.5); }

/* S2: spec line */
#shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,8,6,0) 45%, rgba(10,8,6,.7) 70%, rgba(10,8,6,.85) 100%); opacity: 0; }
#spec { text-shadow: 0 2px 14px rgba(0,0,0,.6); position: absolute; left: 110px; right: 110px; top: 1420px; color: var(--light); font-weight: 400; font-size: 36px; letter-spacing: 1px; line-height: 1.3; }
#spec .rule { display: block; height: 1px; background: rgba(246,242,235,.8); margin-bottom: 26px; transform-origin: 0 50%; }
#spec .w { display: inline-block; opacity: 0; margin-right: 14px; }
#spec .dash { color: rgba(246,242,235,.85); }

/* split panels */
.pane { position: absolute; overflow: hidden; }
.tag { position: absolute; left: 110px; bottom: 90px; font-family: 'DM Serif Display', serif; font-style: italic; font-size: 50px; line-height: 1.2; color: var(--light); text-shadow: 0 2px 18px rgba(0,0,0,.45); opacity: 0; }

/* S5 lockup */
#lock { position: absolute; left: 0; right: 0; top: 1150px; text-align: center; }
#lock .ln { display: block; overflow: hidden; height: 172px; }
#lock .ln > span { display: inline-block; font-family: 'DM Serif Display', serif; font-size: 146px; line-height: 1.18; letter-spacing: -3px; }
#lock .rule { display: block; width: 220px; height: 1px; margin: 34px auto 30px; background: var(--brass); transform-origin: 50% 50%; transform: scaleX(0); }
#lock .sub { display: block; font-weight: 500; font-size: 28px; letter-spacing: 7px; color: rgba(23,19,15,.85); opacity: 0; line-height: 1.3; }
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="17.25" data-width="1080" data-height="1920">

  <!-- S1 0-3.45: the headline is a window onto the living room, then the stem of the l swallows the page -->
  <div class="layer" id="s1" style="z-index:1">
    <video class="clip" id="v1" src="assets/living.mp4" data-start="0" data-duration="3.5" data-track-index="1" muted playsinline></video>
    <div id="knock"><div id="head"><span class="ln"><span>Light</span></span><span class="ln"><span><span id="stem">l</span>ives</span></span><span class="ln"><span>here.</span></span></div></div>
  </div>
  <div id="mast" style="z-index:2"><span>MAISON AURELLE</span><span>FOR SALE</span></div>

  <!-- S2 3.45-6.5: dining, spec line word by word -->
  <div class="layer" id="s2" style="z-index:3;opacity:0">
    <video class="clip" id="v2" src="assets/dining.mp4" data-start="3.45" data-duration="3.1" data-track-index="2" muted playsinline></video>
    <div id="shade"></div>
    <div id="spec"><span class="rule"></span><span class="w">4 Bedrooms</span><span class="w dash">—</span><span class="w">320 m²</span><span class="w dash">—</span><span class="w">Sea view</span></div>
  </div>

  <!-- S3 5.75-8.9: two rooms stacked, wiped in from opposite sides -->
  <div class="pane" id="p3a" style="z-index:4;left:0;top:0;width:1080px;height:956px;clip-path:inset(0 100% 0 0)">
    <video class="clip" id="v3a" src="assets/chairs-h.mp4" data-start="5.75" data-duration="2.45" data-track-index="3" muted playsinline></video>
    <div class="tag" id="t3a">The dining room</div>
  </div>
  <div class="pane" id="p3b" style="z-index:4;left:0;top:964px;width:1080px;height:956px;clip-path:inset(0 0 0 100%)">
    <video class="clip" id="v3b" src="assets/kitchen-h.mp4" data-start="5.75" data-duration="3.15" data-track-index="4" muted playsinline></video>
    <div class="tag" id="t3b">The kitchen</div>
  </div>

  <!-- S4 8.05-11.5: two tall columns, the bedroom column opens to full frame -->
  <div class="pane" id="p4b" style="z-index:5;left:0;top:0;width:1080px;height:1920px;clip-path:inset(0 0 100% 544px)">
    <video class="clip" id="v4b" src="assets/living.mp4" data-start="8.05" data-duration="1.35" data-media-start="3.2" data-track-index="5" muted playsinline></video>
  </div>
  <div class="pane" id="p4a" style="z-index:6;left:0;top:0;width:1080px;height:1920px;clip-path:inset(100% 544px 0 0)">
    <video class="clip" id="v4a" src="assets/bedroom.mp4" data-start="8.05" data-duration="3.5" data-media-start="0.6" data-track-index="6" muted playsinline></video>
    <div class="tag" id="t4a">The main suite</div>
  </div>

  <!-- S5 11.5-17.25: the villa, then it folds back into a page window with the lockup -->
  <div class="pane" id="p5" style="z-index:7;left:0;top:0;width:1080px;height:1920px;opacity:0;clip-path:inset(0px 0px 0px 0px)">
    <video class="clip" id="v5" src="assets/villa.mp4" data-start="11.5" data-duration="5.75" data-media-start="0.2" data-track-index="7" muted playsinline></video>
  </div>
  <div id="lock" style="z-index:8;opacity:0">
    <span class="ln"><span>Maison Aurelle</span></span>
    <span class="rule"></span>
    <span class="sub">PRIVATE VIEWING BY APPOINTMENT</span>
  </div>

  <audio id="music" src="assets/music.mp3" data-start="0" data-duration="17.25" data-track-index="9" data-volume="0.9"></audio>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  const E = "expo.inOut";

  // S1 — headline lines rise out of their masks; the footage inside drifts in slowly
  tl.fromTo("#head .ln > span", { yPercent: 105 }, { yPercent: 0, duration: 1.0, stagger: 0.14, ease: "expo.out" }, 0.1);
  tl.fromTo("#mast", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.3);
  tl.fromTo("#v1", { scale: 1.0 }, { scale: 1.12, duration: 3.5, ease: "none" }, 0);
  // stem zoom: scale the page around the stem of the "l" until the type fills the frame
  const stemOrigin = () => {
    const k = document.getElementById("knock"), s = document.getElementById("stem");
    let x = 0, y = 0, e = s;
    while (e && e !== k) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
    return (x + s.offsetWidth * 0.5 - 12) + "px " + (y + s.offsetHeight * 0.62) + "px";
  };
  tl.to("#knock", { scale: 40, transformOrigin: stemOrigin, duration: 1.05, ease: "expo.in" }, 2.3);
  tl.to("#knock", { opacity: 0, duration: 0.25, ease: "none" }, 3.15);
  tl.to("#mast", { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, 2.3);

  // S2 — hard cut on the beat, slow push, spec line word by word
  tl.set("#s2", { opacity: 1 }, 3.45);
  tl.fromTo("#v2", { scale: 1.04 }, { scale: 1.14, duration: 3.1, ease: "none", immediateRender: false }, 3.45);
  tl.fromTo("#shade", { opacity: 0 }, { opacity: 1, duration: 0.6, immediateRender: false }, 3.6);
  tl.fromTo("#spec .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: E, immediateRender: false }, 3.75);
  tl.fromTo("#spec .w", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.24, ease: "power2.out", immediateRender: false }, 4.05);

  tl.set("#s2", { opacity: 0 }, 6.6);
  // S3 — split-frame wipe: top from the left, bottom from the right
  tl.fromTo("#p3a", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 0.75, ease: E, immediateRender: false }, 5.6);
  tl.fromTo("#p3b", { clipPath: "inset(0px 0px 0px 100%)" }, { clipPath: "inset(0px 0px 0px 0%)", duration: 0.75, ease: E, immediateRender: false }, 5.7);
  tl.fromTo("#v3a", { scale: 1.02 }, { scale: 1.12, duration: 2.6, ease: "none", immediateRender: false }, 5.75);
  tl.fromTo("#v3b", { scale: 1.12 }, { scale: 1.02, duration: 3.1, ease: "none", immediateRender: false }, 5.75);
  tl.fromTo(["#t3a", "#t3b"], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.15, ease: "power2.out", immediateRender: false }, 6.45);
  tl.to(["#t3a", "#t3b"], { opacity: 0, duration: 0.3, immediateRender: false }, 7.7);

  // S4 — two tall columns wipe in vertically, then the suite opens to full frame
  tl.fromTo("#p4a", { clipPath: "inset(100% 544px 0px 0px)" }, { clipPath: "inset(0% 544px 0px 0px)", duration: 0.75, ease: E, immediateRender: false }, 7.9);
  tl.fromTo("#p4b", { clipPath: "inset(0px 0px 100% 544px)" }, { clipPath: "inset(0px 0px 0% 544px)", duration: 0.75, ease: E, immediateRender: false }, 8.0);
  tl.fromTo("#v4a", { x: 270, scale: 1.05 }, { x: 270, scale: 1.1, duration: 0.8, ease: "none", immediateRender: false }, 8.05);
  tl.fromTo("#v4b", { x: -270, scale: 1.12 }, { x: -270, scale: 1.04, duration: 1.35, ease: "none", immediateRender: false }, 8.05);
  tl.to("#p4a", { clipPath: "inset(0% 0px 0px 0px)", duration: 0.85, ease: E }, 8.85);
  tl.to("#v4a", { x: 0, duration: 0.85, ease: E }, 8.85);
  tl.to("#v4a", { scale: 1.2, duration: 2.6, ease: "none" }, 9.2);
  tl.fromTo("#t4a", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 9.9);
  tl.to("#t4a", { opacity: 0, duration: 0.3 }, 11.1);

  // S5 — hard cut to the villa; it folds back into a window on the ivory page
  tl.set("#p5", { opacity: 1 }, 11.5);
  tl.fromTo("#v5", { scale: 1.16 }, { scale: 1.0, duration: 5.75, ease: "power1.out", immediateRender: false }, 11.5);
  tl.fromTo("#p5", { clipPath: "inset(0px 0px 0px 0px)" }, { clipPath: "inset(170px 84px 820px 84px)", duration: 1.15, ease: E, immediateRender: false }, 12.65);
  tl.set("#lock", { opacity: 1 }, 13.4);
  tl.fromTo("#lock .ln > span", { yPercent: 105 }, { yPercent: 0, duration: 1.0, ease: "expo.out", immediateRender: false }, 13.45);
  tl.fromTo("#lock .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: E, immediateRender: false }, 13.9);
  tl.fromTo("#lock .sub", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, 14.3);
  tl.to({}, { duration: 0.01 }, 17.24);

  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
})();
</script></body></html>
