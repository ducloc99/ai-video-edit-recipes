<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
/* "Location, location" — 9:16, 16 s, music only. Marina One is fictional; travel times are illustrative.
   Tags ride point tracks measured from the footage (tools/track.py -> data/track*.json, inlined below). */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0f12; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0f12; font-family: 'Inter', sans-serif; color: #fff;
  --ink: #fff; --accent: #E9C27A; }
.sc { position: absolute; inset: 0; overflow: hidden; }
.clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ov { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
/* soft top/bottom shade so white tags read on bright footage */
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,10,14,.28) 0%, rgba(6,10,14,0) 22%, rgba(6,10,14,0) 70%, rgba(6,10,14,.3) 100%); }

/* tracked tag: wrapper sits on the target point; children animate */
.tag { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.tag .dot { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 5px rgba(255,255,255,.28), 0 2px 8px rgba(0,0,0,.35); }
.tag svg.ld { position: absolute; left: 0; top: 0; overflow: visible; }
.tag svg.ld line { stroke: #fff; stroke-width: 2.5; }
.tag .lb { position: absolute; white-space: nowrap; padding: 14px 22px 15px; background: rgba(10,14,18,.62); border-radius: 6px;
  font-size: 34px; line-height: 1.2; letter-spacing: .01em; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.tag .lb b { font-weight: 700; }
.tag .lb span { font-weight: 400; color: rgba(255,255,255,.78); }
.tag .lb { left: 0; }

/* project pin */
#pinTag .pin { position: absolute; left: -30px; top: -84px; width: 60px; height: 84px; transform-origin: 50% 100%; }
#pinTag .sh { position: absolute; left: -20px; top: -6px; width: 40px; height: 12px; border-radius: 50%; background: rgba(0,0,0,.35); }
#pinTag .card { position: absolute; left: -200px; top: -262px; width: 400px; text-align: center; padding: 20px 0 22px; background: rgba(10,14,18,.62); border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
#pinTag .card b { display: block; font-weight: 700; font-size: 44px; line-height: 1.2; letter-spacing: .2em; margin-right: -.2em; text-shadow: 0 2px 16px rgba(0,0,0,.45); }
#pinTag .card span { display: block; margin-top: 8px; font-size: 28px; line-height: 1.25; letter-spacing: .3em; margin-right: -.3em; color: rgba(255,255,255,.85); text-transform: uppercase; text-shadow: 0 2px 12px rgba(0,0,0,.5); }

/* route */
#route path.glow { stroke: rgba(10,14,18,.35); stroke-width: 16; fill: none; stroke-linecap: round; stroke-linejoin: round; }
#route path.ln { stroke: var(--accent); stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
#head { position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 6px solid var(--accent); }

/* lockup */
#lock { position: absolute; left: 0; right: 0; top: 300px; text-align: center; color: #0E1A22; }
#lock .mk { display: block; margin: 0 auto 34px; width: 44px; height: 62px; }
#lock b { display: block; font-weight: 700; font-size: 72px; line-height: 1.2; letter-spacing: .2em; margin-right: -.2em; }
#lock i { display: block; width: 140px; height: 3px; margin: 30px auto 28px; background: #0E1A22; }
#lock span { display: block; font-weight: 400; font-size: 40px; line-height: 1.25; letter-spacing: .18em; margin-right: -.18em; }
#lift { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(246,244,238,.55) 0%, rgba(246,244,238,.25) 30%, rgba(246,244,238,0) 46%); }
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">

  <!-- shot 1: the building + nearby places -->
  <div class="sc" id="S1">
    <div class="ov" id="W1">
      <video id="v1" class="clip" src="assets/s1.mp4" data-start="0" data-duration="5.5" data-track-index="1" muted playsinline></video>
      <div class="shade"></div>
      <div class="tag" id="tSchool" data-h="380"><svg class="ld" width="1" height="1"><line x1="0" y1="0" x2="0" y2="-380" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg><i class="dot"></i>
        <div class="lb" style="bottom:380px"><b>International school</b><span> · 8 min</span></div></div>
      <div class="tag" id="tMetro" data-h="200"><svg class="ld" width="1" height="1"><line x1="0" y1="0" x2="0" y2="-200" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg><i class="dot"></i>
        <div class="lb" style="bottom:200px"><b>Metro</b><span> · 3 min</span></div></div>
      <div class="tag" id="pinTag"><i class="sh"></i>
        <svg class="pin" viewBox="0 0 60 84"><path d="M30 2C14.5 2 2 14.3 2 29.6 2 50 30 82 30 82s28-32 28-52.4C58 14.3 45.5 2 30 2z" fill="#fff"/><circle cx="30" cy="29" r="11" fill="#E9C27A"/></svg>
        <div class="card"><b>MARINA ONE</b><span>Residences</span></div></div>
    </div>
  </div>

  <!-- shot 2: the coast road -->
  <div class="sc" id="S2">
    <div class="ov" id="W2">
      <video id="v2" class="clip" src="assets/s2.mp4" data-start="5.5" data-duration="4.5" data-track-index="2" muted playsinline></video>
      <div class="shade"></div>
      <svg id="route" class="ov" width="1080" height="1920" viewBox="0 0 1080 1920"><path class="glow" id="rg" d="M0 0" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><path class="ln" id="rl" d="M0 0" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
      <i id="head"></i>
      <div class="tag" id="tDown" data-h="160"><svg class="ld" width="1" height="1"><line x1="0" y1="0" x2="0" y2="-160" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg><i class="dot"></i>
        <div class="lb" style="bottom:160px"><b>Downtown</b><span> · 12 min</span></div></div>
      <div class="tag" id="tBeach" data-h="200"><svg class="ld" width="1" height="1"><line x1="0" y1="0" x2="0" y2="-200" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg><i class="dot"></i>
        <div class="lb" style="bottom:200px"><b>Beach</b><span> · 5 min</span></div></div>
    </div>
  </div>

  <!-- shot 3: lockup -->
  <div class="sc" id="S3">
    <div class="ov" id="W3">
      <video id="v3" class="clip" src="assets/s3.mp4" data-start="10" data-duration="6" data-track-index="3" muted playsinline></video>
      <div id="lift"></div>
      <div id="lock">
        <svg class="mk" viewBox="0 0 60 84"><path d="M30 2C14.5 2 2 14.3 2 29.6 2 50 30 82 30 82s28-32 28-52.4C58 14.3 45.5 2 30 2z" fill="#0E1A22"/><circle cx="30" cy="29" r="11" fill="#E9C27A"/></svg>
        <b>MARINA ONE</b><i></i><span>Coming 2027</span>
      </div>
    </div>
  </div>

  <audio id="music" src="assets/music.mp3" data-start="0" data-duration="16" data-track-index="9" data-volume="0.9"></audio>
</div>
<script>/*TRK*/</script>
<script>
(function () {
  const T = window.TRK, FPS = 30;
  const at = (arr, t) => { // linear interpolation of a per-frame track at local time t
    const f = Math.max(0, Math.min(arr.length - 1, t * FPS)), i = Math.floor(f), j = Math.min(arr.length - 1, i + 1), k = f - i;
    return [arr[i][0] + (arr[j][0] - arr[i][0]) * k, arr[i][1] + (arr[j][1] - arr[i][1]) * k];
  };
  const place = (sel, p, ox, oy) => gsap.set(sel, { x: p[0] + (ox || 0), y: p[1] + (oy || 0) });
  // tracked tag: wrapper on the point; label slides along the top of a leader so it stays inside x 80..960
  const L = 80, R = 960;
  const tag = (id, p) => {
    place(id, p);
    const ax = Math.max(L, Math.min(R, p[0])), f = (ax - L) / (R - L), el = document.querySelector(id);
    const h = +el.dataset.h, ln = el.querySelector("line");
    ln.setAttribute("x2", (ax - p[0]).toFixed(1)); ln.setAttribute("y2", -h);
    gsap.set(id + " .lb", { x: ax - p[0], xPercent: -f * 100, transformOrigin: (f * 100).toFixed(1) + "% 100%" });
  };
  // point at fraction u along a cubic path (pure math, no DOM measurement)
  const cub = (a, b, c, d, t) => { const m = 1 - t; return m * m * m * a + 3 * m * m * t * b + 3 * m * t * t * c + t * t * t * d; };
  let SEG = [];
  const headAt = (u) => {
    const pts = [];
    SEG.forEach(([p1, c1, c2, p2], si) => { for (let k = si ? 1 : 0; k <= 24; k++) { const t = k / 24; pts.push([cub(p1[0], c1[0], c2[0], p2[0], t), cub(p1[1], c1[1], c2[1], p2[1], t)]); } });
    const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const target = cum[cum.length - 1] * u; let i = 1; while (i < cum.length - 1 && cum[i] < target) i++;
    const k = (target - cum[i - 1]) / Math.max(1e-6, cum[i] - cum[i - 1]);
    return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * k, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k];
  };
  // Catmull-Rom through points -> cubic path
  const crPath = (P) => {
    SEG = [];
    let d = "M" + P[0][0].toFixed(1) + " " + P[0][1].toFixed(1);
    for (let i = 0; i < P.length - 1; i++) {
      const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      SEG.push([p1, c1, c2, p2]);
      d += " C" + c1.map(v => v.toFixed(1)).join(" ") + " " + c2.map(v => v.toFixed(1)).join(" ") + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
    }
    return d;
  };
  const rl = document.getElementById("rl"), rg = document.getElementById("rg");
  const S1 = 0, S2 = 5.5, S3 = 10;
  const tl = gsap.timeline({ paused: true });
  const IR = { immediateRender: false };

  // --- trackers: one linear driver per shot; positions are a pure function of shot time
  const d1 = { t: 0 }, d2 = { t: 0, draw: 0 };
  const upd1 = () => {
    const rp = at(T.s1.roof, d1.t);
    place("#pinTag", rp, 0, -6);
    gsap.set("#pinTag .card", { x: Math.max(280, Math.min(800, rp[0])) - rp[0] });
    tag("#tSchool", at(T.s1.school, d1.t));
    tag("#tMetro", at(T.s1.metro, d1.t));
  };
  const upd2 = () => {
    const t = d2.t, RP = ["r0", "r1", "r2", "r3", "r4", "r5"].map(k => at(T.s2[k], t));
    const d = crPath(RP); rl.setAttribute("d", d); rg.setAttribute("d", d);
    const off = 1 - d2.draw; rl.setAttribute("stroke-dashoffset", off); rg.setAttribute("stroke-dashoffset", off);
    const hp = headAt(d2.draw);
    gsap.set("#head", { x: hp[0], y: hp[1] });
    tag("#tDown", RP[5]);
    tag("#tBeach", at(T.s2.beach, t));
  };
  tl.fromTo(d1, { t: 0 }, { t: 5.5, duration: 5.5, ease: "none", onUpdate: upd1 }, S1);
  tl.fromTo(d2, { t: 0 }, { t: 4.5, duration: 4.5, ease: "none", onUpdate: upd2, immediateRender: false }, S2);
  upd1(); d2.t = 0; upd2();

  // --- tag reveal: dot, leader draws, label rises in
  const pop = (id, t) => {
    tl.fromTo(id + " .dot", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.4)", ...IR }, t);
    tl.fromTo(id + " line", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.out", ...IR }, t + 0.12);
    tl.fromTo(id + " .lb", { opacity: 0, scale: 0.9, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "expo.out", ...IR }, t + 0.36);
  };
  gsap.set([".tag .dot"], { scale: 0 }); gsap.set(".tag .lb", { opacity: 0 });
  gsap.set(["#pinTag .pin", "#pinTag .sh", "#pinTag .card", "#pinTag .card b", "#pinTag .card span", "#head", "#lift", "#lock .mk", "#lock b", "#lock span"], { opacity: 0 });
  gsap.set("#lock i", { scaleX: 0 });
  // shot wrappers: only the live shot's overlays show
  gsap.set(["#S2", "#S3"], { opacity: 0 });
  tl.set("#S1", { opacity: 0 }, S2); tl.set("#S2", { opacity: 1 }, S2);
  tl.set("#S2", { opacity: 0 }, S3); tl.set("#S3", { opacity: 1 }, S3);

  // shot 1 (0-5.5): slow settle, pin drops on the building, then the neighbours
  tl.fromTo("#W1", { scale: 1.06 }, { scale: 1, duration: 5.5, ease: "power1.out" }, S1);
  tl.fromTo("#pinTag .pin", { y: -260, opacity: 0, scaleY: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.in", ...IR }, 0.55);
  tl.to("#pinTag .pin", { keyframes: [{ scaleY: 0.86, scaleX: 1.08, duration: 0.09, ease: "power2.out" }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(3)" }] }, 1.05);
  tl.fromTo("#pinTag .sh", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.in", ...IR }, 0.55);
  tl.fromTo("#pinTag .card", { opacity: 0, scale: 0.92, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "expo.out", ...IR }, 1.15);
  tl.fromTo("#pinTag .card b", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out", ...IR }, 1.25);
  tl.fromTo("#pinTag .card span", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", ...IR }, 1.42);
  pop("#tSchool", 2.0);
  pop("#tMetro", 2.55);

  // shot 2 (5.5-10): the coast road draws itself toward downtown; the beach is right there
  tl.fromTo("#W2", { scale: 1.05 }, { scale: 1, duration: 0.9, ease: "expo.out", ...IR }, S2);
  tl.fromTo(d2, { draw: 0 }, { draw: 1, duration: 1.9, ease: "power2.inOut", onUpdate: upd2, ...IR }, S2 + 0.35);
  tl.fromTo("#head", { opacity: 0 }, { opacity: 1, duration: 0.15, ...IR }, S2 + 0.35);
  tl.to("#head", { opacity: 0, scale: 0.4, duration: 0.25 }, S2 + 2.3);
  pop("#tDown", S2 + 2.1);
  pop("#tBeach", S2 + 1.0);

  // shot 3 (10-16): clean lockup over the coast
  tl.fromTo("#W3", { scale: 1.06 }, { scale: 1.0, duration: 6, ease: "power1.out", ...IR }, S3);
  tl.fromTo("#lift", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out", ...IR }, S3);
  tl.fromTo("#lock .mk", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", ...IR }, S3 + 0.35);
  tl.fromTo("#lock b", { opacity: 0, scale: 1.06, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 1.1, ease: "expo.out", ...IR }, S3 + 0.55);
  tl.fromTo("#lock i", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out", ...IR }, S3 + 1.0);
  tl.fromTo("#lock span", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", ...IR }, S3 + 1.2);
  tl.to({}, { duration: 0.01 }, 15.99);

  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
})();
</script></body></html>
